<!DOCTYPE html>
<html>
<head>
<title>Autonomous Drone Airspace Radar</title>
<style>
  body { background: #0c1017; color: #e6edf3; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; text-align: center; margin: 0; padding: 20px; }
  .panel { background: #161b22; border: 1px solid #30363d; border-radius: 12px; width: 850px; margin: 0 auto; padding: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
  h2 { color: #58a6ff; margin-top: 0; letter-spacing: 1px; }
  svg { background: #0d1117; border: 1px solid #21262d; border-radius: 8px; }
  .legend { display: flex; justify-content: center; gap: 20px; margin-top: 15px; font-size: 14px; }
  .legend-item { display: flex; align-items: center; gap: 8px; }
  .dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; }
</style>
</head>
<body>
<div class='panel'>
  <h2>Autonomous Drone Fleet Airspace Visualizer</h2>
  <p style='color: #8b949e;'>Phase-II Project Evaluation | Team ID: DSCPP-III-2026-T154</p>
  <svg width='800' height='500'>
    <line x1='500' y1='437.2' x2='700' y2='130' stroke='#30363d' stroke-width='2' stroke-dasharray='4' />
    <line x1='500' y1='437.2' x2='700' y2='130' stroke='#30363d' stroke-width='2' stroke-dasharray='4' />
    <circle cx='700' cy='130' r='14' fill='#58a6ff' stroke='#ffffff' stroke-width='2' />
    <text x='700' y='135' fill='#0d1117' font-weight='bold' font-size='11' text-anchor='middle'>2</text>
    <text x='700' y='110' fill='#e6edf3' font-size='12' font-weight='500' text-anchor='middle'>Hotel</text>
    <circle cx='500' cy='437.2' r='14' fill='#58a6ff' stroke='#ffffff' stroke-width='2' />
    <text x='500' y='442.2' fill='#0d1117' font-weight='bold' font-size='11' text-anchor='middle'>1</text>
    <text x='500' y='417.2' fill='#e6edf3' font-size='12' font-weight='500' text-anchor='middle'>Hospital</text>
    <circle cx='100' cy='450' r='14' fill='#d29922' stroke='#ffffff' stroke-width='2' />
    <text x='100' y='455' fill='#0d1117' font-weight='bold' font-size='11' text-anchor='middle'>0</text>
    <text x='100' y='430' fill='#e6edf3' font-size='12' font-weight='500' text-anchor='middle'>Central_Depot</text>
  </svg>
  <div class='legend'>
    <div class='legend-item'><span class='dot' style='background: #2ea043;'></span> Active Mission Route</div>
    <div class='legend-item'><span class='dot' style='background: #da3633;'></span> Blocked / No-Fly Corridor</div>
    <div class='legend-item'><span class='dot' style='background: #30363d;'></span> Available Open Airway</div>
    <div class='legend-item'><span class='dot' style='background: #d29922;'></span> Central Depot</div>
  </div>
</div>
</body>
</html>
